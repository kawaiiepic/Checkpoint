[package]
name = "checkpoint-companion"
version = "0.1.0"
edition = "2021"
description = "Terminal-only Eglantine save watcher"
license = "MIT"

[dependencies]
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
